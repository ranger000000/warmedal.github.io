<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Value of Fine Silver in a WW1 British War Medal</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #value { font-size: 2em; font-weight: bold; color: #333; }
        #loading { font-size: 1.5em; color: #666; }
        #error { color: red; }
        #timestamp { font-size: 0.9em; color: #888; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Market Value of Fine Silver in a WW1 British War Medal</h1>
    <div id="loading">Loading current silver price...</div>
    <div id="value"></div>
    <div id="timestamp"></div>
    <div id="error"></div>

    <script>
        async function fetchSilverPrice() {
            const loadingEl = document.getElementById('loading');
            const valueEl = document.getElementById('value');
            const timestampEl = document.getElementById('timestamp');
            const errorEl = document.getElementById('error');

            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
                if (!response.ok) throw new Error('Failed to fetch price data');
                
                const data = await response.json();
                const xagRate = data.usd.xag;
                
                if (!xagRate || xagRate <= 0) throw new Error('No silver price data available');

                const pricePerTroyOunceUSD = 1 / xagRate;

                const usdToGbpRate = data.usd.gbp;

                if (!usdToGbpRate) throw new Error('No GBP exchange rate available');

                const gramsPerTroyOunce = 31.1034768;
                const pricePerGramUSD = pricePerTroyOunceUSD / gramsPerTroyOunce;
                const valueInGBP = (pricePerGramUSD * usdToGbpRate) * 26.06;

                valueEl.textContent = `£${valueInGBP.toFixed(2)}`;
                
                // Show only the date (e.g., 31/12/2025)
                const today = new Date();
                const dateStr = today.toLocaleDateString('en-GB'); // UK format: DD/MM/YYYY
                timestampEl.textContent = `Spot price as of ${dateStr}`;
                
                loadingEl.style.display = 'none';
            } catch (err) {
                errorEl.textContent = 'Error loading price: ' + err.message + '. Try refreshing.';
                loadingEl.style.display = 'none';
            }
        }

        // Load on page load and refresh every 5 minutes (in case the daily update rolls over)
        fetchSilverPrice();
        setInterval(fetchSilverPrice, 300000);
    </script>
</body>
</html>
